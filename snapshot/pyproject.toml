[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deuteron-wigner"
version = "0.1.0"
description = "GTMD-first light-front deuteron Wigner and TMD framework"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
joint-learning = [
    "torch==2.6.0",
    "PennyLane==0.38.0",
    "PennyLane-Lightning==0.38.0",
    "autoray==0.6.12",
]
analysis = [
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "pypdf>=6,<7",
    "PyMuPDF>=1.26,<2",
    "reportlab>=4,<5",
    "pytest>=8.4,<9",
]
quantum = [
    "sympy>=1.12,<2",
    "mpmath>=1.3,<2",
    "PennyLane==0.38.0",
    "PennyLane-Lightning==0.38.0",
    "autoray==0.6.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
